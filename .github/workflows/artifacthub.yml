name: Artifact Hub metadata

# Artifact Hub reads the repository metadata of an OCI chart from the tag `artifacthub.io`
# next to the chart, in the media types below.
on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/artifacthub-repo.yml"
      - ".github/workflows/artifacthub.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: Push the repository metadata
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Push artifacthub-repo.yml
        working-directory: deploy/helm
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          oras push "ghcr.io/${owner}/charts/protem:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
