name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Check generated files are committed
        run: |
          make manifests generate generate-ts docs-reference
          git diff --exit-code -- api config/crd config/rbac web/src/generated docs/reference

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun test src

      - name: Build
        run: bun run build

  packaging:
    name: Helm chart and OLM bundle
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Check the chart matches the generated manifests
        run: |
          make manifests helm-sync
          git diff --exit-code -- deploy/helm

      - name: Lint the chart
        run: make helm-lint

      - name: Generate and validate the OLM bundle
        run: make bundle VERSION=0.0.1 IMG=ghcr.io/illeniumstudios/protem:v0.0.1

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=manager
          cache-to: type=gha,scope=manager,mode=max

      - name: Build the agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: enforcer
          push: false
          cache-from: type=gha,scope=manager
