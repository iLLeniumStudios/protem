# A request created with kubectl must name its caller as the requester.
#
# The UI creates requests through the operator, which fills in spec.requester from the login.
# Created directly, spec.requester is whatever the manifest says, and approval rules, the
# self-approval check and the binding all trust it. This policy makes the API server compare it
# with the identity it authenticated:
#   - spec.requester.username must be the caller's username
#   - spec.requester.email must be empty or equal to that username
#   - every group in spec.requester.groups must be one of the caller's groups
#
# A caller RBAC allows the verb "delegate" on accessrequests in the request's namespace may name
# anyone: the operator holds it, because it creates requests on behalf of the person logged in
# to the UI. Whoever holds that verb can request access in anyone's name.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: requester-identity
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["protem.dev"]
      apiVersions: ["*"]
      operations: ["CREATE"]
      resources: ["accessrequests"]
  matchConditions:
  - name: may-not-delegate
    expression: "!authorizer.group('protem.dev').resource('accessrequests').namespace(object.metadata.namespace).check('delegate').allowed()"
  validations:
  - expression: "object.spec.requester.username == request.userInfo.username"
    messageExpression: "'spec.requester.username must be your own username, ' + request.userInfo.username"
  - expression: "object.spec.requester.email == '' || object.spec.requester.email == request.userInfo.username"
    messageExpression: "'spec.requester.email must be empty or ' + request.userInfo.username"
  - expression: "!has(object.spec.requester.groups) || object.spec.requester.groups.all(g, g in request.userInfo.groups)"
    message: "spec.requester.groups may only list groups you belong to"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: requester-identity
spec:
  policyName: requester-identity
  validationActions: ["Deny"]
