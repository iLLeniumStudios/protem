apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: protem
    app.kubernetes.io/managed-by: kustomize
  name: protem-agent
rules:
- apiGroups:
  - protem.dev
  resources:
  - clustergrants
  verbs:
  - list
- apiGroups:
  - protem.dev
  resources:
  - clustergrants/status
  verbs:
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  verbs:
  - create
  resourceNames:
  - protem-agent
