apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: protem
    app.kubernetes.io/managed-by: kustomize
  name: protem-agent
rules:
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - clusterrolebindings
  verbs:
  - get
  - list
  - create
  - update
  - delete
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - clusterroles
  verbs:
  - get
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - clusterroles
  verbs:
  - bind
  # The ceiling of what the hub can ever grant on this cluster: the agent can only bind
  # roles named here. The cluster owner extends this list deliberately.
  resourceNames:
  - view
  - edit
