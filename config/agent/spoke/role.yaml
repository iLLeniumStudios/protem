# Lets the agent keep its renewed hub token in the Secret that holds its hub kubeconfig.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: protem
    app.kubernetes.io/managed-by: kustomize
  name: protem-agent
  namespace: protem-system
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - patch
  resourceNames:
  - protem-agent-hub
