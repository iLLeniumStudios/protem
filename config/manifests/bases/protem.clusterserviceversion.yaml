        on the hub; created by the operator and carried out by the cluster's agent.
      displayName: Cluster Grant
      kind: ClusterGrant
      name: clustergrants.protem.dev
      statusDescriptors:
      - description: What the agent reported, for example Active or Expired.
        displayName: Phase
        path: phase
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.phase
      - displayName: Message
        path: message
