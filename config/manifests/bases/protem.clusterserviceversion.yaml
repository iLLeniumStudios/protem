      displayName: Access Profile
      kind: AccessProfile
      name: accessprofiles.protem.dev
      statusDescriptors:
      - description: Grants from this profile that are active now.
        displayName: Active Grants
        path: activeGrantsCount
        x-descriptors:
        - urn:alm:descriptor:text
      - displayName: Conditions
        path: conditions
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.conditions
      version: v1alpha1
    - description: One person's request for a profile's role on some clusters for a
        limited time; created by people, from the UI or with kubectl.
      displayName: Access Request
      kind: AccessRequest
      name: accessrequests.protem.dev
      statusDescriptors:
      - description: Where the request is in its life, for example Pending or Approved.
        displayName: Phase
        path: phase
        x-descriptors:
        - urn:alm:descriptor:io.kubernetes.phase
      - description: The AccessGrant created for this request.
        displayName: Grant
        path: grantRef
        x-descriptors:
        - urn:alm:descriptor:text
      - displayName: Conditions
